name: Weekly All-Projects Blog

on:
  schedule:
    - cron: '0 10 * * 1' # Every Monday at 10:00 AM UTC (1 hour after chess blog)
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch cross-project data
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: bash .github/scripts/fetch-all-data.sh

      - name: Save data for Claude
        run: cp /tmp/weekly-blog-data.json ./data-current.json

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Brennan's weekly development blog writer. Your task: generate a blog
            post covering everything Brennan worked on this week, then update the index and state.

            ## Steps

            1. Read `data-current.json` — this contains:
               - GitHub Events for user bh679 (commits, PRs, issues across all repos)
               - Per-repo commit summaries and merged PRs
               - Chess project board items with statuses
               - Previous week's state for comparison

            2. Read existing blog posts in `posts/` for style reference (if any exist).

            3. Create a new file `posts/YYYY-MM-DD.md` using today's date (run `date -u +%Y-%m-%d`).
               The post should have:
               - YAML frontmatter: title, date, summary, projects (list of active repos)
               - Overview paragraph
               - Per-project sections (one section per active repo)
               - Chess Project Board section (status changes since last week)
               - Coming Up section
               - 400-800 words, conversational, developer-focused

            4. Update `README.md` — add a new table row above the
               `<!-- New posts are added above this line -->` comment.
               Format: `| [YYYY-MM-DD](posts/YYYY-MM-DD.md) | <title> |`

            5. Update `state.json` — overwrite with current snapshot:
               ```json
               {
                 "last_run": "YYYY-MM-DD",
                 "repos_snapshot": { <per-repo summary from data> },
                 "chess_project_board_snapshot": { "items": <items array> }
               }
               ```

            6. Delete `data-current.json` (temporary file).

            7. Commit and push: `git add posts/ state.json README.md && git commit -m "blog: weekly update YYYY-MM-DD" && git push`

          claude_args: "--max-turns 15 --allowedTools Edit,Read,Write,Bash(date:*),Bash(git:*),Bash(rm:*)"

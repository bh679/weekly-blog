name: Weekly All-Projects Blog

on:
  schedule:
    - cron: '0 10 * * 1' # Every Monday at 10:00 AM UTC (1 hour after chess blog)
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch cross-project data
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: bash .github/scripts/fetch-all-data.sh

      - name: Save data for Claude
        run: cp /tmp/weekly-blog-data.json ./data-current.json

      - name: Clone wiki
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/bh679/weekly-blog.wiki.git wiki-checkout
          cd wiki-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.18
          CLAUDE_BIN=$(which claude)
          echo "CLAUDE_PATH=$CLAUDE_BIN" >> $GITHUB_ENV
          echo "Claude Code version: $(claude --version)"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_PATH }}
          prompt: |
            You are Brennan's weekly development blog writer. Your task: generate a blog
            post covering everything Brennan worked on this week, then publish it to the wiki.

            ## Steps

            1. Read `blog-post-guidelines.md` — these are the writing guidelines you MUST follow for the blog post.

            2. Read `blog-index-template.md` — this is the template you MUST follow when updating the wiki Home page (which IS the blog index).

            3. Read `data-current.json` — this contains:
               - GitHub Events for user bh679 (commits, PRs, issues across all repos)
               - Per-repo commit summaries and merged PRs
               - Chess project board items with statuses
               - Previous week's state for comparison
               - `pending_context`: array of enriched feature entries queued since the last run (may be empty)

            4. Read existing blog posts in `wiki-checkout/` (files matching `Blog:-*.md`) for style reference.

            5. Get today's date: `date -u +%Y-%m-%d`

            6. Create a new wiki page file in `wiki-checkout/`.
               - **Skip guard:** If `github_events.total == 0` AND every entry in
                 `repos_with_activity` has `commit_count == 0` AND `pr_count == 0`
                 AND `pending_context` is empty — skip writing a post this week
                 (nothing happened). Jump directly to step 8 to update state.
               - Choose a sharp, descriptive title for the blog post
               - Convert the title to a hyphenated slug (e.g. "AutoClaude Launches" → "AutoClaude-Launches")
               - Filename: `wiki-checkout/Blog:-<Title-Slug>.md` (e.g. `Blog:-AutoClaude-Launches.md`)
               - Do NOT include dates in the filename
               - Follow the blog post guidelines from step 1. Compare current data to `previous_state` to identify what changed.
               - If `pending_context` contains entries, treat each as a first-class feature section:
                 - Use the `framing` field as the narrative angle and opening hook for that feature's section
                 - Use `feature.description` for the body; reference `feature.pr_url` as a link if provided
                 - If `feature.wiki_link` is provided, link to it from the feature section
                 - If `screenshots` entries are listed, reference them by description (e.g. "as shown in the screenshot") — do not embed images, just acknowledge them in prose
                 - Use `commits` as supporting detail (e.g. to enumerate sub-changes within the feature)
                 - If `pending_context` is empty, write the blog post from GitHub data alone as normal

            6a. Self-blog: check for weekly-blog activity
                Look in `repos_with_activity` for the entry where `repo == "bh679/weekly-blog"`.
                If `commit_count == 0` AND `pr_count == 0` AND no `pending_context` entries
                have a `project` value matching "weekly-blog", skip steps 6b and 6c.

            6b. Self-blog: write a self-blog post for this repo
                - Covers only changes to the weekly-blog repo itself (workflow updates,
                  prompt changes, template changes, data-collection script changes,
                  schema changes, bug fixes, new features to the blogging system)
                - Follow the same writing guidelines from step 1 (blog-post-guidelines.md)
                - Compare the `bh679/weekly-blog` entry in `repos_with_activity` against
                  `previous_state.repos_snapshot["bh679/weekly-blog"]` to identify what
                  is new this week
                - For `pending_context` entries whose `project` matches "weekly-blog", treat
                  them as first-class feature sections (same framing/description/wiki_link/
                  screenshots/commits rules as step 6). NOTE: these entries belong in the
                  self-blog — in step 6 (all-projects post), mention them briefly by name
                  only rather than writing a full feature section.
                - Filename: `wiki-checkout/Self-Blog:-<Title-Slug>.md`
                - Breadcrumb line: `[[Self-Blog:-Weekly-Blog-Index]] · Post Title`
                - Project link line: `[weekly-blog](https://github.com/bh679/weekly-blog)`
                - End with a call to action

            6c. Self-blog: update the self-blog index page
                - Check if `wiki-checkout/Self-Blog:-Weekly-Blog-Index.md` exists
                - If it does NOT exist, create it with this exact header:
                  ```
                  # Weekly Blog — Development Log

                  Changes to the workflow, templates, and tooling that generate this
                  automated blog. Updated automatically every Monday.

                  <!-- New posts are added above this line -->
                  ```
                - Add a new entry above `<!-- New posts are added above this line -->`.
                  Follow the self-blog index format from step 2 (blog-index-template.md):
                  ```
                  ## [<title>](/bh679/weekly-blog/wiki/Self-Blog:-<Title-Slug>)
                  YYYY-MM-DD — Weekly Blog
                  <1-2 sentence abstract>
                  ```

            7. Update `wiki-checkout/Home.md` — add a new entry above the
               `<!-- New posts are added above this line -->` comment.
               Follow the blog index template from step 2. Use a markdown link (NOT wiki-link syntax). Format:
               ```
               ## [<title>](/bh679/weekly-blog/wiki/Blog:-<Title-Slug>)
               YYYY-MM-DD — All Projects
               <1-2 sentence abstract>
               ```
               After updating the post list, also ensure `Home.md` contains a static
               "About This Blog" section at the very bottom. Check for its presence first —
               if already there, do NOT modify it. If absent, append:
               ```
               ---

               ## About This Blog
               [Weekly Blog Development Log](/bh679/weekly-blog/wiki/Self-Blog:-Weekly-Blog-Index) — changes to the workflow, templates, and tooling that generate this blog.
               ```

            8. Update `state.json` — overwrite with current snapshot:
               ```json
               {
                 "last_run": "YYYY-MM-DD",
                 "repos_snapshot": { <per-repo summary from data> },
                 "chess_project_board_snapshot": { "items": <items array> }
               }
               ```

            9. Delete `data-current.json` (temporary file).

            10. Commit and push the wiki:
                ```bash
                cd wiki-checkout && git add -A && git commit -m "Blog: weekly update YYYY-MM-DD" && git push
                ```

            11. Clear pending context and commit state in the main repo:
                - Write `[]` to `pending-context.json` (overwrite the file to empty the queue)
                - Then commit and push:
                ```bash
                cd /home/runner/work/weekly-blog/weekly-blog && git add state.json pending-context.json && git commit -m "blog: update state YYYY-MM-DD" && git push
                ```

          claude_args: "--max-turns 35 --allowedTools Edit,Read,Write,Bash(date:*),Bash(git:*),Bash(rm:*),Bash(cd:*),Bash(ls:*)"

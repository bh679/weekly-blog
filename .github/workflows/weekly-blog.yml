name: Weekly All-Projects Blog

on:
  schedule:
    - cron: '0 10 * * 1' # Every Monday at 10:00 AM UTC (1 hour after chess blog)
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch cross-project data
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: bash .github/scripts/fetch-all-data.sh

      - name: Save data for Claude
        run: cp /tmp/weekly-blog-data.json ./data-current.json

      - name: Clone wiki
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/bh679/weekly-blog.wiki.git wiki-checkout
          cd wiki-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.18
          CLAUDE_BIN=$(which claude)
          echo "CLAUDE_PATH=$CLAUDE_BIN" >> $GITHUB_ENV
          echo "Claude Code version: $(claude --version)"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_PATH }}
          prompt: |
            You are Brennan's weekly development blog writer. Your task: generate a blog
            post covering everything Brennan worked on this week, then publish it to the wiki.

            ## Steps

            1. Read `data-current.json` — this contains:
               - GitHub Events for user bh679 (commits, PRs, issues across all repos)
               - Per-repo commit summaries and merged PRs
               - Chess project board items with statuses
               - Previous week's state for comparison

            2. Read existing blog posts in `wiki-checkout/` (files matching `Blog:-*.md`) for style reference.

            3. Get today's date: `date -u +%Y-%m-%d`

            4. Create a new file `wiki-checkout/Blog:-YYYY-MM-DD.md` (replace YYYY-MM-DD with today's date).
               The post should have:
               - First line: `[[Home]] · [[Development-Blog]] · Blog: YYYY-MM-DD`
               - A blank line, then `# <Post Title>`
               - Overview paragraph
               - Per-project sections (one section per active repo)
               - Chess Project Board section (status changes since last week)
               - Coming Up section
               - 400-800 words, conversational, developer-focused
               - NO YAML frontmatter — this is a wiki page, not a markdown file

            5. Update `wiki-checkout/Development-Blog.md` — add a new table row above the
               `<!-- New posts are added above this line -->` comment.
               Format: `| YYYY-MM-DD | [[Blog:-YYYY-MM-DD|<title>]] |`

            6. Update `state.json` — overwrite with current snapshot:
               ```json
               {
                 "last_run": "YYYY-MM-DD",
                 "repos_snapshot": { <per-repo summary from data> },
                 "chess_project_board_snapshot": { "items": <items array> }
               }
               ```

            7. Delete `data-current.json` (temporary file).

            8. Commit and push the wiki:
               ```bash
               cd wiki-checkout && git add -A && git commit -m "Blog: weekly update YYYY-MM-DD" && git push
               ```

            9. Commit and push state in the main repo:
               ```bash
               cd /home/runner/work/weekly-blog/weekly-blog && git add state.json && git commit -m "blog: update state YYYY-MM-DD" && git push
               ```

          claude_args: "--max-turns 25 --allowedTools Edit,Read,Write,Bash(date:*),Bash(git:*),Bash(rm:*),Bash(cd:*),Bash(ls:*)"
